# Disynk XcodeGen 工程定义（方案第五节：工程文件文本化、可复现构建）
# 用法：xcodegen generate（需 CLT/Xcode 修复后与 Package.swift 一同生效；
#       当前开发环境 CLT 缺陷下以 Scripts/build.sh 的 swiftc 直编链为准）
name: Disynk
options:
  bundleIdPrefix: com.disynk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO   # 路径 B 打包时由 Scripts/package.sh 覆盖
targets:
  Disynk:
    type: application
    platform: macOS
    sources:
      - Sources/DisynkApp
      - Sources/DKCore
      - Sources/DKSettings
      - Sources/DKEncode
      - Sources/DKMux
      - Sources/DKCapture
      - Sources/DKCompose
      - Sources/DKAudio
      - Sources/DKShot
      - Sources/DKOverlay
      - Sources/DKExport
      - Sources/DKVirtualDisplay
      - Sources/DKLicense
      - Sources/DVKObjC
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSScreenCaptureUsageDescription: Disynk 需要屏幕录制权限以录制显示器画面与截图。
        NSMicrophoneUsageDescription: Disynk 需要麦克风权限以录制语音解说。
    entitlements:
      path: Resources/Disynk.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disynk.app
        OTHER_CFLAGS: "-fmodules"
  DKTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DKTests
    dependencies:
      - target: Disynk
